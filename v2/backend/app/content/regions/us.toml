# Fixed crisis text for REGION=US. Written and reviewed by people, never generated.
region = "US"

[crisis]
heading = "You can get help now."
lines = [
    "If you or someone else is in danger now, call 911.",
    "To talk to a crisis counselor now, call or text 988.",
    "If phone calls are hard, you can chat online at 988lifeline.org.",
    "Your answers are saved. You do not need to finish this form now.",
]
# Words that always trigger the crisis response, before and regardless of the LLM.
# Matching is case-insensitive substring matching on the normalized message.
keywords = [
    "kill myself",
    "killing myself",
    "suicide",
    "suicidal",
    "end my life",
    "want to die",
    "wanna die",
    "better off dead",
    "hurt myself",
    "hurting myself",
    "self harm",
    "self-harm",
    "cut myself",
    "overdose",
    "no reason to live",
    "don't want to be alive",
    "do not want to be alive",
    "not safe at home",
    "going to hurt someone",
]

# What happens after "Talk to a person", in a real clinic. While SYNTHETIC_ONLY (always, in
# this demo) the app adds "This is a demo. No one will contact you." right after these lines.
[needs_human]
with_contact = [
    "We have asked a staff member to contact you.",
    "They will use the phone number or email in your form.",
]
without_contact = [
    "We have asked a staff member to help you.",
    "We do not have a phone number or email for you yet.",
]
no_form = [
    "To talk to a person, call the clinic and say you need help with your form.",
]
