[project]
name = "intake-v2"
version = "0.1.0"
description = "One-question-at-a-time intake assistant (demo, synthetic data only)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlmodel==0.0.47",
    "google-adk==2.10.0",
    "google-genai==2.25.0",
    "phonenumbers==9.0.40",
    "email-validator==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "textstat==0.7.13",
    "httpx2==2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20", "S", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # asserts; git subprocess in repo-hygiene tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["textstat"]  # dev-only wording checks; ships no type stubs
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not live\""
markers = [
    "live: calls a real LLM API; deselected by default and in CI (run with -m live)",
]
